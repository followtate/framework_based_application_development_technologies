<div class="card source-card mb-3 shadow-sm">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-start">
      <div>
        <h5 class="card-title mb-1">
          {{ source.title|default:"Без названия" }}
        </h5>
        <p class="text-muted mb-2">{{ source.author }} ({{ source.year }})</p>
      </div>
      <span class="badge bg-primary">{{ source.type }}</span>
    </div>
    <a
      href="{% url 'sources:detail' source.id %}"
      class="btn btn-sm btn-outline-primary mt-2"
    >
      Подробнее
    </a>
  </div>
</div>
