{% extends "base.html" %}
{% block title %}Источники — Читальня{% endblock %}
{% block content %}
  <h1 class="mb-3">Источники</h1>
  <p class="text-muted">Всего источников: {{ sources|length }}</p>

  <div class="row">
    <div class="col-md-8">
      {% for source in sources %}

        {% include "sources/includes/source_card.html" %}
      {% empty %}
        <div class="alert alert-info">Источников пока нет.</div>
      {% endfor %}
    </div>
  </div>
{% endblock %}
